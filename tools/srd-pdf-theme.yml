extends: default

page:
  background_color: FBF7EF

base:
  font_color: 2B2118

heading:
  font_color: 7A1F1F
  h2:
    font_color: 7A1F1F
    font_size: 17
  h3:
    font_color: 9A3B26
    font_size: 13
  h4:
    font_color: 7A4A1F
    font_size: 11

title_page:
  text_align: center
  title:
    top: 45%
    font_color: 7A1F1F
    font_size: 30
  subtitle:
    font_size: 14
    font_style: normal_italic
    font_color: 9A3B26
  authors:
    font_size: 12
    margin_top: 30
  revision:
    font_size: 10
    font_color: 7A6A55

toc:
  indent: 12
  dot_leader:
    font_color: C9A26B

table:
  border_color: D8C9AE
  grid_width: 0.5
  head:
    background_color: F0E6D3
  body:
    stripe_background_color: F5EFE3

image:
  align: center

link:
  font_color: 7A1F1F

footer:
  font_size: 9
  height: 0.5in
  border_width: 0
  left:
    content: "Glorantha Perspectives"
    font_color: 7A6A55
  right:
    content: "{page-number} / {page-count}"
    font_color: 7A6A55
  recto:
    right:
      content: ""
  verso:
    left:
      content: ""
