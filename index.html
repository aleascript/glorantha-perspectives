<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glorantha Perspectives</title>
  <noscript>
    <meta http-equiv="refresh" content="0;url={{ '/content/en/' | relative_url }}">
  </noscript>
</head>
<body>
  <script>
    (function () {
      var STORAGE_KEY = "glorantha-perspectives-lang";
      var SUPPORTED = ["en", "fr"];
      var DEFAULT = "en";
      var BASE = {{ "/" | relative_url | jsonify }};

      function getSaved() {
        try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
      }

      function detect() {
        var saved = getSaved();
        if (saved && SUPPORTED.indexOf(saved) !== -1) return saved;

        var langs = navigator.languages || [navigator.language || navigator.userLanguage];
        for (var i = 0; i < langs.length; i++) {
          var code = langs[i].toLowerCase().split("-")[0];
          if (SUPPORTED.indexOf(code) !== -1) {
            try { localStorage.setItem(STORAGE_KEY, code); } catch (e) {}
            return code;
          }
        }
        return DEFAULT;
      }

      var target = detect();
      window.location.replace(BASE.replace(/\/$/, "") + "/content/" + target + "/");
    })();
  </script>
  <noscript>
    <p>Redirecting… <a href="{{ '/content/en/' | relative_url }}">English</a> | <a href="{{ '/content/fr/' | relative_url }}">Français</a></p>
  </noscript>
</body>
</html>
