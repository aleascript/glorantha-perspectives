name: Verify image migration

on:
  push:
    branches:
      - refactor/player-guide-docusaurus

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate image links
        run: node tools/migrate-image-links.mjs && git diff --exit-code -- docs
      - name: Build French site
        run: npm run build:fr
      - name: Build publications
        run: npm run publication:build
      - name: Build English site
        continue-on-error: true
        run: npm run build:en
