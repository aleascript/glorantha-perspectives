name: Build, release and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Diagnose English dev-server rune assets
        shell: bash
        run: |
          set -euo pipefail
          npm run start:en -- --no-open --host 127.0.0.1 > /tmp/docusaurus-en.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          page='http://127.0.0.1:3000/glorantha-perspectives/en/perspectives/resolution/framing/'
          for attempt in {1..60}; do
            if curl --silent --fail --output /tmp/framing-en.html "$page"; then
              break
            fi
            sleep 1
          done

          test -s /tmp/framing-en.html || { cat /tmp/docusaurus-en.log; exit 1; }
          grep -q 'data-runes=chapter' /tmp/framing-en.html

          echo 'Root asset:'
          curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' \
            'http://127.0.0.1:3000/glorantha-perspectives/img/runes/movement.png'
          echo 'Localized asset:'
          curl --silent --show-error --output /dev/null --write-out '%{http_code}\n' \
            'http://127.0.0.1:3000/glorantha-perspectives/en/img/runes/movement.png'

          grep -o 'src=[^ >]*movement.png' /tmp/framing-en.html | head -5
          cat /tmp/docusaurus-en.log | tail -30

      - name: Build site and publications
        run: npm run release:prepare

      - name: Upload publication artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publications
          path: dist/publications
          if-no-files-found: error

      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build
          if-no-files-found: error
          include-hidden-files: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Download publication artifacts
        uses: actions/download-artifact@v5
        with:
          name: publications
          path: dist/publications

      - name: Download site build
        uses: actions/download-artifact@v5
        with:
          name: site-build
          path: build

      - name: Detect unpublished publication content
        id: publication_state
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          current_manifest='dist/publications/publications.json'
          release_date="$(date -u +%F)"

          jq -e '
            (.publications | length > 0) and
            all(.publications[]; (.contentHash // "") != "")
          ' "$current_manifest" > /dev/null

          latest_tag="$(
            gh release list \
              --limit 100 \
              --json tagName,isDraft \
              --jq 'map(select((.isDraft | not) and (.tagName | startswith("publications-")))) | .[0].tagName // ""'
          )"

          previous_manifest=""
          if [[ -n "$latest_tag" ]]; then
            asset_names="$(
              gh release view "$latest_tag" \
                --json assets \
                --jq '.assets[].name'
            )"
            if grep -Fxq 'publications.json' <<< "$asset_names"; then
              mkdir -p .previous-release
              gh release download "$latest_tag" \
                --pattern publications.json \
                --dir .previous-release
              previous_manifest='.previous-release/publications.json'
            fi
          fi

          current_state="$(
            jq -cS \
              '[.publications[] | {id, version, contentHash}] | sort_by(.id)' \
              "$current_manifest"
          )"
          previous_state='[]'
          previous_has_fingerprints=false

          if [[ -n "$previous_manifest" ]]; then
            previous_state="$(
              jq -cS \
                '[.publications[] | {id, version, contentHash}] | sort_by(.id)' \
                "$previous_manifest"
            )"
            if jq -e '
              (.publications | length > 0) and
              all(.publications[]; (.contentHash // "") != "")
            ' "$previous_manifest" > /dev/null; then
              previous_has_fingerprints=true
            fi
          fi

          if [[ "$current_state" == "$previous_state" ]]; then
            changed=false
          else
            changed=true
          fi

          if [[ "$changed" == true && "$previous_has_fingerprints" == true ]]; then
            stale_changes="$(
              jq -r \
                --arg today "$release_date" \
                --slurpfile previous "$previous_manifest" '
                  .publications[] as $current
                  | ($previous[0].publications[] | select(.id == $current.id)) as $old
                  | select(
                      $old.contentHash != $current.contentHash and
                      $current.version != $today
                    )
                  | "\($current.id) (version \($current.version))"
                ' "$current_manifest"
            )"

            if [[ -n "$stale_changes" ]]; then
              echo '::error::Publication content changed without updating its version to today.'
              echo 'Update these publication versions before merging:'
              echo "$stale_changes"
              exit 1
            fi
          fi

          {
            echo "changed=$changed"
            echo "previous_tag=$latest_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Publish dated publication snapshot
        if: steps.publication_state.outputs.changed == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          release_date="$(date -u +%F)"
          tag="publications-${release_date}"
          notes_file="$RUNNER_TEMP/publication-release-notes.md"

          {
            echo 'Snapshot des publications générées par Vivliostyle.'
            echo
            echo 'Versions publiées :'
            echo
            jq -r '.publications[] | "- `\(.id)` : `\(.version)` — `\(.contentHash[0:12])`"' \
              dist/publications/publications.json
            echo
            printf 'Source : [%s](%s/%s/commit/%s)\n' \
              "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > "$notes_file"

          [[ -f dist/publications/publications.json ]]
          compgen -G 'dist/publications/*.pdf' > /dev/null
          mapfile -d '' assets < <(
            find dist/publications -maxdepth 1 -type f \
              \( -name '*.pdf' -o -name 'publications.json' \) \
              -print0 | sort -z
          )

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          fi

          gh release create "$tag" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Publications — ${release_date}" \
            --notes-file "$notes_file"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: publish
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
