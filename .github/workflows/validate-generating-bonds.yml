name: Validate generating bonds runes

on:
  push:
    branches:
      - refactor/player-guide-docusaurus
    paths:
      - .github/workflows/validate-generating-bonds.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:fr
      - run: npm run build:en
