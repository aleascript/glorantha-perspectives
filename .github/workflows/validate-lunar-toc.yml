name: Validate Lunar Way TOC

on:
  push:
    branches:
      - refactor/player-guide-docusaurus
    paths:
      - .github/workflows/validate-lunar-toc.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run publication:build

      - uses: actions/upload-artifact@v4
        with:
          name: lunar-way-toc-check
          path: |
            dist/publications/the-lunar-way-fr.pdf
            dist/publications/the-lunar-way-en.pdf
          if-no-files-found: error
