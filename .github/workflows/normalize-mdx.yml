name: Normalize migrated MDX

on:
  push:
    branches:
      - refactor/player-guide-docusaurus

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize legacy img elements
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          async function walk(dir) {
            const result = [];
            for (const entry of await fs.readdir(dir, {withFileTypes: true})) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) result.push(...await walk(full));
              else if (/\.mdx?$/.test(entry.name)) result.push(full);
            }
            return result;
          }

          let changed = 0;
          for (const file of await walk('docs')) {
            const before = await fs.readFile(file, 'utf8');
            const after = before.replace(/<img\b([^>]*?)>/g, (whole, attrs) =>
              /\/\s*$/.test(attrs) ? whole : `<img${attrs} />`,
            );
            if (after !== before) {
              await fs.writeFile(file, after, 'utf8');
              changed += 1;
            }
          }
          console.log(`Normalized ${changed} Markdown/MDX files.`);
          EOF
      - name: Commit normalization
        run: |
          if git diff --quiet -- docs; then
            echo 'No normalization needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          git commit -m 'content: normalize legacy img tags for MDX'
          git push
