name: Validate PR pass

on:
  push:
    branches:
      - refactor/player-guide-docusaurus
    paths:
      - .github/workflows/validate-pr-pass.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:fr
      - run: npm run build:en
      - run: npm run publication:build

      - name: Check publication outputs
        run: |
          test -s dist/publications/glorantha-perspectives-guide-fr.pdf
          test -s dist/publications/the-lunar-way-fr.pdf
          test -s dist/publications/the-lunar-way-en.pdf
