name: Validate PR pass

on:
  push:
    branches:
      - refactor/player-guide-docusaurus
    paths:
      - .github/workflows/validate-pr-pass.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build:fr
      - run: npm run build:en

      - name: Build publications without missing images
        run: |
          set -o pipefail
          npm run publication:build 2>&1 | tee publication-build.log
          if grep -qE '404.*http://localhost:[0-9]+/img/' publication-build.log; then
            echo 'Vivliostyle reported missing /img assets'
            exit 1
          fi

      - name: Check publication outputs
        run: |
          test -s dist/publications/glorantha-perspectives-guide-fr.pdf
          test -s dist/publications/the-lunar-way-fr.pdf
          test -s dist/publications/the-lunar-way-en.pdf
